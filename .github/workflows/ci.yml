name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r webapp/backend/requirements.txt

      - name: Compile Python (syntax check)
        run: python -m compileall -q webapp/backend

      - name: Backend import smoke test
        run: |
          cd webapp
          python -c "import backend.main"

      - name: Backend unit tests
        run: |
          cd webapp
          python -m unittest discover -s backend/tests -t .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS syntax check
        run: |
          node --check webapp/frontend/app.js
          node --check webapp/frontend/results.js
